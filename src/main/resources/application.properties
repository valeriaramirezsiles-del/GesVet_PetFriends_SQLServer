spring.application.name=GesVet

# Conexion a SQL Server con autenticacion integrada de Windows
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=gesvet_petfriends;integratedSecurity=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion de JPA (El dialecto se detecta automaticamente evitando warnings de deprecacion)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Credenciales de administradores y veterinarios por defecto (se sincronizan a BD)
gesvet.admin.username=${GESVET_ADMIN_USER:admin_demo}
gesvet.admin.password=${GESVET_ADMIN_PASSWORD:DemoAdmin2026!}

gesvet.vet.username=${GESVET_VET_USER:veterinario_demo}
gesvet.vet.password=${GESVET_VET_PASSWORD:DemoVet2026!}
